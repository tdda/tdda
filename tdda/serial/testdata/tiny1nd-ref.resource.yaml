name: tiny1nd-ref
type: table
path: tiny1nd-ref.csv
scheme: file
format: csv
mediatype: text/csv
encoding: UTF-8
dialect:
  header: true
  headerRows:
  - 0
  csv:
    delimiter: ','
    quoteChar: '"'
    escapeChar: \
schema:
  fields:
  - name: b
    type: boolean
  - name: i
    type: integer
  - name: f
    type: number
  - name: s
    type: string
  - name: t
    type: date
  missingValues:
  - ''
