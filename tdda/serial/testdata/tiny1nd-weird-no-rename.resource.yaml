dialect:
  csv:
    delimiter: ;
    doubleQuote: false
    quoteChar: ''''
  header: true
  header_rows:
  - 0
encoding: latin-1
format: csv
mediatype: text/csv
name: tiny1nd
path: tiny1nd-weird.ssv
schema:
  fields:
  - falseValues:
    - 'No'
    - n
    name: b
    trueValues:
    - 'Yes'
    - y
    type: boolean
  - name: i
    type: integer
  - name: f
    type: number
  - name: s
    type: string
  - format: '%d/%m/%Y'
    name: t
    type: date
  missingValues:
  - .
scheme: file
type: table
