resources:
- name: tiny1nd
  type: table
  path: tiny1nd-weird.ssv
  scheme: file
  format: csv
  mediatype: text/csv
  encoding: latin-1
  dialect:
    header: true
    headerRows:
    - 0
    delimiter: ;
    quoteChar: ''''
    doubleQuote: false
  schema:
    fields:
    - name: b
      type: boolean
      trueValues:
      - 'Yes'
      - y
      falseValues:
      - 'No'
      - n
    - name: i
      type: integer
    - name: f
      type: number
    - name: s
      type: string
    - name: t
      type: date
      format: '%d/%m/%Y'
    missingValues:
    - .
