name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        env:
          TDDA_FAIL_DIR: ${{ runner.temp }}/tdda-failures
        run: |
          python -c "import os; os.makedirs(os.environ['TDDA_FAIL_DIR'], exist_ok=True)"
          python tdda/testtdda.py

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tdda-failures-${{ matrix.os }}
          path: ${{ runner.temp }}/tdda-failures
          if-no-files-found: ignore
